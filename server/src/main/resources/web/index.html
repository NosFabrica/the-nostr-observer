<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Nostr Observer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>The Nostr Observer</h1>
      <p class="motto">Your web of trust, as a front page.</p>
    </header>

    <main>
      <section id="signin" hidden>
        <h2>Sign in</h2>
        <p>Sign in with your Nostr key. You can only make your own paper, never somebody else's.</p>
        <div class="row">
          <button id="nip07">Use my extension</button>
          <span class="or">or</span>
          <input id="bunker" type="text" placeholder="bunker://… from your signer app" spellcheck="false" />
          <button id="nip46">Connect signer</button>
        </div>
        <p class="note" id="signin-note"></p>
      </section>

      <section id="desk" hidden>
        <h2>Today's edition</h2>
        <p class="who"><span id="me"></span> · <button id="signout" class="link">sign out</button></p>

        <div id="readiness" class="panel"></div>

        <div class="row">
          <button id="generate">Print today's paper</button>
        </div>

        <ol id="progress" class="progress"></ol>
        <div id="result" class="panel" hidden></div>
      </section>
    </main>

    <footer>
      <p>Your last 24 hours, read through the people you trust. Published under your own key, to your own servers.</p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
