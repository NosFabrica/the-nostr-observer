[versions]
# Quartz's own Kotlin: its metadata is read by this compiler.
kotlin = "2.4.21"
app = "0.2.0"

# Quartz from JitPack (vitorpamplona/quartz @ commit): the Observer site, NIP-FA, NIP-FB and
# their runner rules (and the `effort` param): release 2.17.0 (tag v2.17.0) plus the jitpack.yml
# change that publishes the iOS variants, the same commit Amethyst pins.
#
# A JitPack version IS a git commit hash, and hashes carry no order. Gradle sees version
# STRINGS and, when two parts of the graph ask for different ones, keeps the lexicographically
# higher, which for hashes is an arbitrary one, chosen silently. That is why every module
# force()s this pin, and why "newer" is a word that does not apply here. The only relation
# between two hashes is ancestry, and only git answers it:
#   git merge-base --is-ancestor A B
quartz = "8c21607e05e77ecf88de8013d849949362411176"
# The crypto primitives Quartz is built on; the engine hashes with them directly. Keep it at
# the version Quartz's own catalog names for the commit above.
cryptoKmp = "2.1.0"

# assistant-runner's `:core` from JitPack (NosFabrica/assistant-runner @ commit): the Assistant keys,
# the `assistant_runner` schema's stores and the trigger contract. A commit hash, like Quartz's,
# so every module force()s it. It pins Quartz too: keep the two `quartz` pins equal. The
# repository is private, so JitPack can't build it yet: `settings.gradle.kts` substitutes a
# checkout (`-PassistantRunnerDir`, or `../assistant-runner`) until it is public.
assistantRunner = "4476b8e845ff16d9c531bbe049407314ff0b6cfd"

coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"
jsoup = "1.21.1"
spotless = "8.8.0"
ktlint = "1.7.1"

[libraries]
quartz = { module = "com.github.vitorpamplona.quartz:quartz", version.ref = "quartz" }
crypto = { module = "com.vitorpamplona.crypto:crypto", version.ref = "cryptoKmp" }
assistant-core = { module = "com.github.NosFabrica.assistant-runner:core", version.ref = "assistantRunner" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# The writer's, Blossom's and the server API's HTTP. `executeAsync` is okhttp-coroutines'.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-coroutines = { module = "com.squareup.okhttp3:okhttp-coroutines", version.ref = "okhttp" }

# The page checks run on a real HTML parser.
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
