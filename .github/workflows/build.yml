name: build

# Phase 1 said the adversarial fixture runs in CI from the first commit. It did
# not: the fixture and the tests existed and nothing ran them on push, which is
# the same as not having them the first time somebody lands a change without
# running `./gradlew build` locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node 20 is gone from the runners; every action here is pinned to a
      # major that ships a node24 entry point, so nothing has to be forced onto
      # a runtime it was not built for.
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # `build` is compile + test + spotlessCheck, so formatting alone fails
      # here exactly as it does in the pre-commit hook.
      - name: Build, test and check formatting
        run: ./gradlew build --no-daemon --console=plain

      # The Claude Code skill is Node, not Kotlin, so gradle never sees it. Its
      # tests use a fake relay that reproduces the hazards in AGENTS.md — the
      # AUTH challenge sent before an answer, the subscription that says
      # nothing — rather than dialling search-staging, so this step holds to
      # the same no-network rule as the one below.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test the Claude Code skills
        run: node --test ".claude/skills/*/test/*.test.mjs"

      # `reference/` is generated. If someone edits system-prompt.md or
      # house.css and does not re-run the sync, the skill ships yesterday's
      # brief — silently, because nothing else reads those copies.
      - name: Check the skill's generated files are current
        run: |
          ./tools/sync-skill.sh
          git diff --exit-code -- .claude/skills/nostr-observer/reference \
            || { echo "::error::.claude/skills/nostr-observer/reference is stale - run tools/sync-skill.sh"; exit 1; }

      # Nothing in this job talks to a relay or to the model API. Every test is
      # meant to pass with no network at all, and a test that quietly needed one
      # would stop running the first week CI was busy.
      #
      # `warn`, not `error`: the step runs on failure so a red test still hands
      # back its report, and when the build dies before `test` there is nothing
      # to upload. Failing here in that case only buries the real error under a
      # louder one about a missing file, which is how the wrapper jar being
      # absent first showed up.
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn
